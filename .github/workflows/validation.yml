name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-swing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Build and validate Swing
        run: xvfb-run -a ./gradlew build :client:uiCheck --no-daemon --console=plain
      - name: Upload test reports and Swing previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            **/build/reports/
            client/build/previews/
          if-no-files-found: ignore
